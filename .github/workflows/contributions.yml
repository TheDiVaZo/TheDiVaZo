name: Profile activity

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "contributions/manual/*.json"
      - ".github/workflows/contributions.yml"

permissions:
  contents: write

concurrency:
  group: profile-contributions
  cancel-in-progress: false

jobs:
  activity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check GitHub activity credentials
        env:
          ACTIVITY_TOKEN: ${{ secrets.GIC_GITHUB_TOKEN }}
        run: |
          if [ -z "$ACTIVITY_TOKEN" ]; then
            echo "::error::Set GIC_GITHUB_TOKEN to a personal access token for the profile owner."
            exit 1
          fi
      - name: Generate activity cards
        uses: TheDiVaZo/git-info-combine@cbaa2a673460c842aaf61129230b701915faf0c3
        with:
          github-token: ${{ secrets.GIC_GITHUB_TOKEN }}
          sources: ${{ secrets.GIC_SOURCES }}
          gitlab-sources: ${{ secrets.GIC_SOURCES == '' && secrets.GIC_GITLAB_SOURCES || '' }}
          manual-contributions-dir: contributions/manual
          cards: heatmap,stats,languages,hosts,wakatime
          equal-heights: false
          layout: |
            heatmap
            stats languages
            wakatime hosts
          layout-width: 800
          layout-gap: 10
          theme: auto
          heatmap-mode: hosts
          github-color: "40c463"
          icon-color: 40c463
          languages-layout: normal
          languages-count: 8
          wakatime-api-key: ${{ secrets.GIC_WAKATIME_TOKEN }}
          wakatime-url: https://api.wakatime.com/api/v1
          wakatime-range: last_30_days
          wakatime-layout: normal
          wakatime-count: 8
          name: TheDiVaZo
          output-dir: git-info-combine
          commit-message: "chore: update profile activity cards"
